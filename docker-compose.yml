---
services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      # 理解している場合のみ変更してください
      - PUID=1000
      - PGID=1000
      # お住まいのタイムゾーンに合わせて編集してください https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=UTC
      # アプリケーションの待機ポートを設定します。デフォルトは 8083 です。
      # - CWA_PORT_OVERRIDE=8083
      # Hardcoverをメタデータプロバイダーとして使用する場合に必要なHardcover APIキー。こちらで入手: https://docs.hardcover.app/api/getting-started/
      - HARDCOVER_TOKEN=your_hardcover_api_key_here
      # ライブラリがネットワーク共有（例：NFS/SMB）上にある場合、ロックや権限の問題を減らすためにWALとchownを無効化し、
      # ファイル監視をinotifyではなくポーリング（ネットワークマウントでより信頼性が高い）に切り替えます。
      # 指定可能: true/false (デフォルト: false)
      - NETWORK_SHARE_MODE=false
      # 共有の種類に関係なくポーリングモードを強制したい場合は、CWA_WATCH_MODE=poll を設定してください
      # - CWA_WATCH_MODE=poll
      # 複数のプロキシ（例：Cloudflare Tunnel + リバースプロキシ）の背後で実行している場合、プロキシの総数を設定してください
      # これにより、セッション保護やレート制限のための適切なIP検出が保証されます（デフォルト: 1）
      # - TRUSTED_PROXY_COUNT=2
      # 起動時の自動ライブラリ検出/マウントをスキップします。有効にすると、自動ライブラリサービスは実行されません。
      # 指定可能: true/yes/1 で自動マウントを無効化 (デフォルト: false)
      # - DISABLE_LIBRARY_AUTOMOUNT=false
    volumes:
      # 移行するCWユーザーは、既存のCWインスタンスを停止し、configフォルダのコピーを作成して、ここにバインドしてすべてのユーザー設定などを引き継ぐ必要があります。
      - /path/to/config/folder:/config
      # これは取り込みディレクトリであり、ライブラリディレクトリではありません。ここに追加されたものはすべて、CWA設定ページで設定した内容に従って自動的にライブラリに追加されます。ここに置かれたすべてのファイルは処理後に削除されます
      - /path/to/the/folder/you/want/to/use/for/book/ingest:/cwa-book-ingest
      # 既存のライブラリがない場合、CWAはここに提供されたバインドで自動的にライブラリを作成します
      - /path/to/your/calibre/library:/calibre-library
      # calibreプラグインを使用している場合、プラグインフォルダをここにバインドしてCWAのワークフローに追加させることができます（開発中）
      # 新規インストールで始める場合、Calibreプラグインの親ディレクトリから customize.py.json を上記のCalibre configボリュームの /path/to/config/folder/.config/calibre/customize.py.json にコピーする必要があります。詳細はREADMEを参照してください
      - /path/to/your/calibre/plugins/folder:/config/.config/calibre/plugins
    ports:
      # 2番目の数字ではなく、最初の数字を変更してWeb UIにアクセスしたいポートを変更してください
      - 8083:8083
    # CWA_PORT_OVERRIDEを1024未満のポートに設定した場合、以下の行のコメントを解除する必要があるかもしれません:
    # cap_add:
    #   - NET_BIND_SERVICE
    restart: unless-stopped
